name: Verify repository

on:
  workflow_dispatch:
  push:
    branches: [main, 'lighthouse/verification-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Check branch and commit conventions
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run check:branch -- "$BRANCH_NAME"
          npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Install Chromium for browser checks
        timeout-minutes: 5
        run: |
          # Keep Ubuntu's signed repositories when the hosted Azure mirror is unavailable.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' |
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "0";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' |
            sudo tee /etc/apt/apt.conf.d/zzzz-lcc-network-timeouts >/dev/null
          apt-config shell RETRIES Acquire::Retries HTTP_TIMEOUT Acquire::http::Timeout HTTPS_TIMEOUT Acquire::https::Timeout
          npx --no -- playwright install --with-deps chromium
      - name: Verify repository, specifications and product citations
        run: npm run verify
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sofa-web-evidence
          path: |
            test-results/
            test-reports/
          if-no-files-found: ignore
          retention-days: 30
