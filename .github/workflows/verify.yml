name: Verify repository

on:
  workflow_dispatch:
  push:
    branches: [main, 'lighthouse/verification-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Check branch and commit conventions
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run check:branch -- "$BRANCH_NAME"
          npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Install Chromium for browser checks
        run: npx --no -- playwright install chromium
      - name: Verify repository, specifications and product citations
        run: npm run verify
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sofa-web-evidence
          path: |
            test-results/
            test-reports/
          if-no-files-found: ignore
          retention-days: 30

  coverage:
    needs: verify
    if: needs.verify.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: dotnet restore tests/SoFa.Web.Tests/SoFa.Web.Tests.csproj --locked-mode
      - name: Produce optional exact-attempt coverage evidence
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          COVERAGE_OUTPUT: test-results/coverage-evidence
        run: node scripts/produce-coverage-report.mjs
      - name: Retain exact-attempt coverage evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/coverage-evidence/coverage.json
          if-no-files-found: ignore
          retention-days: 30
