name: Development identity E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: identity-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Restore locked application dependencies
        run: dotnet restore SoFa.slnx --locked-mode --disable-build-servers
      - name: Install Chromium and isolated browser trust tooling
        run: |
          npx --no -- playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y libnss3-tools
      - name: Exercise real provider sessions, revocation and outage
        run: npm run verify:identity:host
      - name: Retain identity E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-identity-e2e
          path: test-results/identity/
          if-no-files-found: ignore
          retention-days: 30
