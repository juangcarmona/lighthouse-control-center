services:
  loki:
    image: grafana/loki:3.5.6
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: [--config=/etc/otelcol-contrib/config.yaml]
    depends_on:
      loki:
        condition: service_started
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
  prometheus:
    image: prom/prometheus:v3.7.3
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=14d]
    depends_on:
      - collector
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD to a private value before starting Grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
