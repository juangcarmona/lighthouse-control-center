<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Lighthouse Control Center</title>
  <desc id="desc">A wooden slatted bench seen from behind faces a calm blue bay, sailboats, a coastal village and a lighthouse on the left headland. Draft composition awaiting comparison with the Loira reference photograph.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0d0f17"/><stop offset="1" stop-color="#172b46"/></linearGradient>
    <linearGradient id="sea" x2="0.4" y2="1"><stop stop-color="#183d6a"/><stop offset="1" stop-color="#111b2b"/></linearGradient>
    <linearGradient id="ground" x2="1" y2="1"><stop stop-color="#26344b"/><stop offset="1" stop-color="#0d0f17"/></linearGradient>
    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#bfa17b"/><stop offset="0.4" stop-color="#987754"/><stop offset="1" stop-color="#70543c"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#4da3ff" stop-opacity=".35"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></linearGradient>
  </defs>
  <path fill="url(#sky)" d="M0 0h1280v640H0z"/>
  <path d="m88 188 1050-48v97L88 199Z" fill="url(#beam)"/>
  <g fill="#8fc2ff" opacity=".4"><circle cx="203" cy="104" r="1"/><circle cx="350" cy="82" r="1"/><circle cx="470" cy="128" r="1.3"/><circle cx="1120" cy="68" r="1"/></g>
  <g font-family="system-ui, sans-serif" fill="#f8faff">
