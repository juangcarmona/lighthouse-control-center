<script>// Isolated review prototype. All records below are invented, and all operations stay local.
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const paths={work:'M3 4h18v16H3z M9 4v16 M15 4v16',projects:'M3 7h7l2-3h9v16H3z',issues:'M4 5h16 M4 12h16 M4 19h16',attention:'M12 3 2 21h20z M12 9v5 M12 17h.01',health:'M2 12h5l3-8 4 16 3-8h5',runtime:'M4 3h16v7H4z M4 14h16v7H4z M7 6h.01 M7 17h.01',account:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 22v-3a8 8 0 0 1 16 0v3',refresh:'M20 7v5h-5 M4 17v-5h5 M5 7a8 8 0 0 1 13-2l2 2 M4 17l2 2a8 8 0 0 0 13-2',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1 1 M18 18l1 1 M5 19l1-1 M18 6l1-1',moon:'M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11',system:'M3 4h18v14H3z M8 22h8 M12 18v4',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 7v5l3 2',queue:'M4 6h16 M4 12h12 M4 18h8',play:'M7 4v16l14-8z',check:'m5 12 4 4L19 6',question:'M9 8a3 3 0 1 1 5 2c-2 1-2 2-2 3 M12 17h.01 M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20',arrow:'M4 12h16 m-6-6 6 6-6 6',menu:'M3 6h18 M3 12h18 M3 18h18',link:'M14 3h7v7 M21 3 10 14 M10 3H3v18h18v-7',file:'M5 2h9l5 5v15H5z M14 2v6h5 M8 13h8 M8 17h6'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.issues}"/></svg>`;
const projects=[['Lighthouse','LH','2 active · 1 future'],['Control Center','CC','1 active · 1 queued'],['DomusMind','DM','1 needs you · 1 future']];
const groups=[['future','Future','Explicit future hold','clock'],['queued','Queued','Source request acknowledged','queue'],['active','In progress','Associated active execution','play'],['needs','Needs you','Verified question or decision','attention'],['unknown','Unclassified','No verified work grouping','question']];
const cards=[
{id:'D-01',project:'Lighthouse',group:'future',title:'Add production delivery measures',signal:'Future hold',next:'Read the scope',age:'3 days ago',stage:'Not started'},
{id:'D-02',project:'DomusMind',group:'future',title:'Explore household assets',signal:'Future hold',next:'Read the idea',age:'Yesterday',stage:'Not started'},
{id:'D-03',project:'Control Center',group:'queued',title:'Keep data visible while refreshing',signal:'Acknowledged request',next:'Inspect request receipt',age:'2 min ago',stage:'Propose'},
{id:'D-04',project:'Lighthouse',group:'active',title:'Recover interrupted runner cleanup',signal:'Execution active',next:'Inspect associated execution',age:'5 min ago',stage:'Implement'},
{id:'D-05',project:'Control Center',group:'active',title:'Explain configuration changes',signal:'Execution active',next:'Read review evidence',age:'4 min ago',stage:'Review'},
{id:'D-06',project:'DomusMind',group:'needs',title:'Choose how shared obligations work',signal:'Decision needed',next:'Read the source question',age:'1 hour ago',stage:'Refine'},
{id:'D-07',project:'Control Center',group:'unknown',title:'Audit navigation and visual density',signal:'Grouping unknown',next:'Read issue context',age:'Just now',stage:'Unknown'},
{id:'D-08',project:'Lighthouse',group:'active',title:'Verify the installed baseline',signal:'Execution active',next:'Inspect source checks',age:'8 min ago',stage:'Verify'}];
const saved=JSON.parse(sessionStorage.getItem('lcc-demo-filters')||'{}');
let view=params.get('view')||'work',project=params.get('project')??saved.project??'',query=params.get('q')??saved.query??'',group=params.get('group')??saved.group??'needs',state=params.get('state')||'fresh';
const currentId=params.get('id')||'D-03',current=cards.find(c=>c.id===currentId)||cards[2];
function href(v,extra={}){const q=new URLSearchParams({view:v,project,q:query,group,...extra});return '?'+q.toString()}
function persist(){sessionStorage.setItem('lcc-demo-filters',JSON.stringify({project,query,group}));history.replaceState({},'',href(view,{...(view==='issue'?{id:currentId}:{})}));}
function badge(text,tone='',sym=''){return `<span class="badge ${tone}">${sym?icon(sym):''}${text}</span>`}
function openSource(kind='issue',record='Branch coverage'){
const descriptions={issue:`<p><strong>${current.id} · ${current.project}</strong></p><p>Illustrative source state: Open · stage ${current.stage}. Work grouping is shown separately from issue state.</p><dl class="kv"><dt>Source updated</dt><dd>14 Nov 2026, 18:58 UTC</dd><dt>Last checked</dt><dd>14 Nov 2026, 19:00 UTC</dd><dt>Association</dt><dd>Sample receipt D-R03; not a live GitHub record.</dd></dl><p>A real view links the exact issue, request and associated execution. Labels alone do not prove queuing or active execution.</p>`,health:'<p><strong>Illustrative coverage check</strong></p><dl class="kv"><dt>Repository</dt><dd>Control Center · sample</dd><dt>Source kind</dt><dd>CI-produced facet</dd><dt>Revision</dt><dd><code>demo-revision-03</code></dd><dt>Run</dt><dd>D-RUN-03 · attempt 1</dd><dt>Observed</dt><dd>14 Nov 2026, 18:45 UTC</dd></dl><p>Example result: branch coverage below the repository’s declared floor. This is invented review data. No live check or score is being reported.</p>',coverage:'<p>Three sample projects; eight illustrative issues. Counts describe the sample only.</p><p>Grouping requires source-backed associations. Future holds, stages, GitHub state, queue admission and execution remain separate facts. Conflicting or missing signals require explicit explanation.</p>',runtime:'<p>Illustrative runtime record. Local registration and provider availability are separate sources.</p><p>A real source disclosure carries provider identity, observation timestamp, exact record and applicable permissions. An unavailable provider read cannot establish capacity or host health.</p>',account:'<p>This prototype uses one fixed demo identity. It has no authentication or connected GitHub account.</p><p>In the application, display restoration must verify actor and scope. Write controls require a fresh authority check independently of saved display data.</p>'};
if(kind==='health'&&record!=='Branch coverage'){descriptions.health=record==='Mutation score'?'<p><strong>Mutation score unavailable</strong></p><p>No retained facet was received for the sample revision. There is no measured value or passing result. Inspect producer configuration and retention before comparing.</p>':record==='Lighthouse workflow'?'<p><strong>Lighthouse · sample workflow outcome</strong></p><p>Observed sample checks passed. Source: D-RUN-LH, attempt 1, demo-revision-LH. No measured facet or production deployment is implied.</p>':'<p><strong>'+record+' · illustrative check</strong></p><p>Sample result: passed. Source: D-RUN-03, attempt 1, demo-revision-03. This is invented evidence for reviewing the drill-down.</p>';}$('source-title').textContent=kind==='health'?record+' evidence':kind==='coverage'?'Scope and grouping':kind==='runtime'?'Runtime source details':kind==='account'?'Connection details':'Issue source details';$('source-content').innerHTML=descriptions[kind]||descriptions.issue;$('source-dialog').showModal();}
function shell(){document.querySelector('nav').innerHTML=[['work','Work'],['projects','Repositories'],['issues','Issues'],['attention','Attention'],['health','Health'],['runtime','Runtime']].map(([v,t])=>`<a href="${href(v)}" ${view===v||(view==='issue'&&v==='issues')||(view==='health-detail'&&v==='health')?'aria-current="page"':''}>${icon(v)}${t}${v==='attention'?'<small>1</small>':''}</a>`).join('');$('rail-projects').innerHTML=projects.map(([p,m])=>`<a class="rail-project" href="${href('work',{project:p})}"><span class="project-mark">${m}</span>${p}</a>`).join('');$('menu').innerHTML=icon('menu');$('refresh').innerHTML=icon('refresh');for(const [m,i]of [['light','sun'],['dark','moon'],['system','system']])$(m).innerHTML=icon(i);$('page-title').textContent=({work:'Work across your projects',projects:'Repositories',issues:'Issues',attention:'Attention',health:'Health',runtime:'Runtime',account:'Account',issue:current.project+' / '+current.id,'health-detail':'Health / Control Center'})[view]||'Work';}
function toolbar(){return `<div class="toolbar"><label class="sr" for="search">Search issues</label><input type="search" id="search" placeholder="Find an issue or project…" value=""><label class="sr" for="project-filter">Project</label><select id="project-filter"><option value="">All projects</option>${projects.map(([p])=>`<option ${project===p?'selected':''}>${p}</option>`).join('')}</select><a href="${href(view==='issues'?'work':'issues')}">${icon(view==='issues'?'work':'issues')} ${view==='issues'?'Board':'List'}</a></div>`}
function statusline(){const copy={fresh:'Checked just now',refreshing:'Saved view · refreshing…',failed:'Saved view · refresh failed',empty:'Collection checked just now',loading:'Reading source…',expired:'Saved view expired · checking source…',revoked:'Connection needs attention'}[state];return `<div class="statusline">${icon(state==='failed'?'attention':'clock')}<span>${copy}</span><span>· 3 projects · sample scope</span><button class="source-button right" data-source="coverage">Scope and grouping</button></div>`}
function card(c){return `<a class="work-card" href="${href('issue',{id:c.id})}"><div class="card-meta"><span>${c.project}</span><span class="mono">${c.id}</span></div><h3>${c.title}</h3>${badge(c.signal,c.group==='needs'?'warn':'',c.group==='needs'?'attention':'')}${c.group==='active'?` <small>${c.stage}</small>`:''}<p class="next">${c.next} ${icon('arrow')}</p><p class="age">Updated ${c.age.toLowerCase()}</p></a>`}
function matched(){return cards.filter(c=>(!project||c.project===project)&&[c.title,c.project,c.id].join(' ').toLowerCase().includes(query.toLowerCase()))}
function renderWork(){const rows=matched();if(view==='issues')return `<div class="panel table-panel"><table class="flat-table"><caption>${rows.length} illustrative issues · same sample as the board</caption><thead><tr><th>Issue</th><th>Project</th><th>Work signal</th><th>Updated</th></tr></thead><tbody>${rows.map(c=>`<tr><td><a href="${href('issue',{id:c.id})}">${c.id} · ${c.title}</a></td><td data-label="Project">${c.project}</td><td data-label="Work signal">${badge(c.signal,c.group==='needs'?'warn':'')}</td><td data-label="Updated">${c.age}</td></tr>`).join('')}</tbody></table>${!rows.length?'<p class="empty">No matching issues in the sample. Clear the search or change project.</p>':''}</div>`;return `<div class="mobile-group"><label class="sr" for="group-filter">Work group</label><select id="group-filter">${groups.map(([id,name])=>`<option value="${id}" ${group===id?'selected':''}>${name} · ${rows.filter(c=>c.group===id).length}</option>`).join('')}<option value="all" ${group==='all'?'selected':''}>All groups · ${rows.length}</option></select></div><div class="board">${!rows.length?'<div class="empty no-match">No matching issues in this sample. Clear the search or change project.</div>':groups.map(([id,title,hint,sym])=>`<section class="lane ${id}" data-group="${id}"><h2 class="lane-heading">${icon(sym)}${title}<span class="count">${rows.filter(c=>c.group===id).length}</span></h2><p class="lane-hint">${hint}</p>${rows.filter(c=>c.group===id).map(card).join('')}</section>`).join('')}</div>`}
function work(){return `<div class="scope-strip">${projects.map(([p,m,summary])=>`<a href="${href('work',{project:p})}"><span class="project-mark">${m}</span><span><strong>${p}</strong><small>${summary}</small></span><span class="end">${p==='DomusMind'?'1 decision':p==='Lighthouse'?'2 running':'1 queued'}</span></a>`).join('')}</div>${toolbar()}${statusline()}<div id="work-results">${renderWork()}</div><p class="notice">${icon('file')} Board groups describe source signals. Open a card to inspect context; this board does not move or schedule work.</p>`}
function repositories(){return `${statusline()}<div class="panel table-panel"><table class="flat-table"><caption>All configured repositories · illustrative directory</caption><thead><tr><th>Repository</th><th>Needs you</th><th>Active work</th><th>Source coverage</th><th>Open</th></tr></thead><tbody>${projects.map(([p,m],i)=>`<tr><td><a href="${href('work',{project:p})}">${p}</a><small class="mono">demo / ${p.toLowerCase().replaceAll(' ','-')}</small></td><td data-label="Needs you">${i===2?badge('1 decision','warn','attention'):'None in sample'}</td><td data-label="Active work">${i===2?'No associated run':i===0?'2 executions':'1 execution'}</td><td data-label="Coverage">${badge(i===2?'Partial':'Available',i===2?'warn':'good')}</td><td data-label="Open"><a href="${href('work',{project:p})}">Open work ${icon('arrow')}</a></td></tr>`).join('')}</tbody></table></div><details class="panel"><summary>Repository configuration and collection scope</summary><p>A real directory displays the configured repository identity, verified access and last checked time. Unreadable projects remain visible with their recovery action.</p></details>`}
function issue(){return `<a href="${href('work')}">← Back to work</a><h2 class="issue-title">${current.title}</h2><div class="issue-state">${badge('Open','good','check')}${badge(current.signal,current.group==='needs'?'warn':'')}<span>Stage: ${current.stage}</span><time datetime="2026-11-14T18:58:00Z" title="14 Nov 2026, 18:58 UTC">Updated ${current.age.toLowerCase()}</time><button class="source-button" data-source="issue">Source details</button></div><div class="two-col"><div><section class="panel context"><h3>Issue context</h3><p>${current.group==='needs'?'A household obligation can be shared by several people. The proposal needs an owner decision before refinement can continue.':'When an operator returns to a view, keep the last permitted data visible while checking for changes. Preserve filters, reading position and unsent work.'}</p>${current.group==='needs'?'<div class="question"><strong>Question from the source</strong><p>Should one person own the obligation, or can responsibility be shared?</p><small>Illustrative question · awaiting the owner</small></div>':'<ul><li>Retain the last view with a visible age.</li><li>Refresh affected records without resetting the screen.</li><li>Clear protected display data when authority is lost.</li></ul>'}<details><summary>Full description and acceptance context</summary><p>Additional sample detail belongs here when a description is long. Opening this disclosure should be preserved for the same issue during updates.</p></details></section><div class="alert">${icon('attention')}<span>Workflow dispatch unavailable. <a href="${href('account')}">Review connection</a>. Your draft remains editable.</span></div><section class="panel composer"><h3>${current.group==='needs'?'Answer the question':'Add a comment'}</h3><label for="draft">Your ${current.group==='needs'?'answer':'comment'}</label><textarea id="draft" placeholder="Write your response…"></textarea><p class="feedback" id="draft-status">Draft saved in this demo tab.</p><button class="primary" id="review-comment">Review ${current.group==='needs'?'answer':'comment'}</button><div id="preview-panel" class="preview" hidden><strong>Preview · nothing has been sent</strong><blockquote id="preview-text"></blockquote><button id="back-to-edit">Back to editing</button></div></section><details class="panel"><summary>Conversation · 3 sample comments</summary><p><strong>Demo reviewer</strong> · Yesterday</p><p>Keep the current reading context visible and put confirmation beside the editor.</p></details></div><section class="panel"><h3>Recorded events</h3><ol class="timeline"><li><strong>Source request acknowledged</strong><small>Today, 18:55 UTC · sample receipt</small></li><li><strong>Issue context updated</strong><small>Today, 18:58 UTC · sample source</small></li><li><strong>Latest check</strong><small>Today, 19:00 UTC · no complete label history available</small></li></ol><p class="notice">Recorded events explain observations. They do not establish a schedule or a complete wait duration.</p><button class="source-button" data-source="issue">Inspect source identity</button></section></div>`}
function attention(){return `${statusline()}<div class="attention-summary"><a href="${href('issue',{id:'D-06'})}"><strong>1</strong>Owner decision</a><a href="${href('health')}"><strong>1</strong>Evidence problem</a><a href="${href('work',{group:'active'})}"><strong>3</strong>Executing independently</a></div><section class="panel"><h2>Needs your answer <small>Sample queue</small></h2><ul class="detail-list"><li>${icon('attention')}<div class="body"><strong>Choose how shared obligations work</strong><small>DomusMind · D-06 · asked 1 hour ago</small><p>Should responsibility belong to one person or be shared?</p></div><a href="${href('issue',{id:'D-06'})}">Read and answer ${icon('arrow')}</a></li></ul></section><section class="panel"><h2>Evidence to investigate</h2><ul class="detail-list"><li>${icon('health')}<div class="body"><strong>Coverage check below its declared floor</strong><small>Control Center · illustrative CI facet</small></div><a href="${href('health-detail')}">Inspect evidence ${icon('arrow')}</a></li></ul></section><details class="panel"><summary>What this queue includes</summary><p>Questions and decisions supported by current source evidence. Retrying work is separate from a human wait. Partial collection is disclosed rather than interpreted as an empty fleet.</p></details>`}
function health(){return `${statusline()}<div class="alert">${icon('attention')}<span><strong>1 check needs investigation.</strong> Control Center · coverage below its declared floor.</span><a href="${href('health-detail')}">Inspect check ${icon('arrow')}</a></div><div class="summary-row"><div><strong>3</strong><span>sample projects</span></div><div><strong>2 / 3</strong><span>with check evidence</span></div><div><strong>1</strong><span>source gap</span></div></div><div class="panel table-panel"><table class="flat-table"><caption>Evidence by project · current sample · no overall health score</caption><thead><tr><th>Project</th><th>Verification evidence</th><th>Latest observation</th><th>Deployment evidence</th><th>Next step</th></tr></thead><tbody><tr><td><a href="${href('health-detail')}">Control Center</a><small>CI-produced facets · partial</small></td><td data-label="Checks">${badge('1 below floor','bad','attention')}<div class="health-cells" aria-hidden="true"><i class="good"></i><i class="good"></i><i class="bad"></i><i></i></div><small>2 passed · 1 below floor · 1 not reported</small></td><td data-label="Observed">15 min ago</td><td data-label="Deployment">Not reported</td><td data-label="Next step"><a href="${href('health-detail')}">Inspect checks ${icon('arrow')}</a></td></tr><tr><td><strong>Lighthouse</strong><small>Workflow outcomes · limited scope</small></td><td data-label="Checks">${badge('Observed checks passed','good','check')}<small>Does not establish production health</small></td><td data-label="Observed">8 min ago</td><td data-label="Deployment">Not applicable to this sample</td><td data-label="Next step"><button class="source-button" data-source="health" data-record="Lighthouse workflow">Read source details</button></td></tr><tr><td><a href="${href('work',{project:'DomusMind'})}">DomusMind</a><small>Facet producer not configured</small></td><td data-label="Checks">${badge('Unavailable','warn','question')}<small>No measured check assessment</small></td><td data-label="Observed">Checked 20 min ago</td><td data-label="Deployment">Unknown environment</td><td data-label="Next step"><button class="source-button" data-source="coverage">Inspect coverage</button></td></tr></tbody></table></div><details class="panel"><summary>Definitions, applicability and history</summary><p>Workflow outcomes, measured facets and deployment receipts answer different questions. A real metric needs a declared definition, sample window, producer and source revision. Missing values do not become zero.</p><p>Trend charts appear only when comparable historical samples exist. This proposal has no measured historical series.</p></details>`}
function healthDetail(){return `<a href="${href('health')}">← All project evidence</a><h2 class="issue-title">Control Center · verification evidence</h2><div class="issue-state">${badge('1 check below floor','bad','attention')}<span>Observed today, 18:45 UTC</span><span>Illustrative revision <code>demo-revision-03</code></span></div><div class="panel table-panel"><table class="flat-table"><caption>Contributing checks · status and provenance stay together</caption><thead><tr><th>Check</th><th>Result</th><th>Source type</th><th>Evidence</th></tr></thead><tbody>${[['Branch coverage','Below declared floor','bad','CI-produced facet'],['Dependency scan','Passed','good','CI-produced facet'],['Unit tests','Passed','good','Workflow check'],['Mutation score','Not reported','','No retained facet']].map(([name,result,tone,source])=>`<tr><td><strong>${name}</strong></td><td data-label="Result">${badge(result,tone)}</td><td data-label="Source">${source}</td><td data-label="Evidence"><button class="source-button" data-source="health" data-record="${name}">${result==='Not reported'?'Why unavailable':'Inspect source record'}</button></td></tr>`).join('')}</tbody></table></div><div class="two-col"><section class="panel"><h3>Change since the last comparable sample</h3><p>Unavailable: this sample has no comparable prior facet.</p><p class="notice">Do not draw a flat trend or imply improvement when history is absent.</p></section><section class="panel"><h3>Deployment evidence</h3><p>Not reported for this sample.</p><p class="notice">A successful check does not confirm a deployment.</p></section></div>`}
function runtime(){return `${statusline()}<div class="alert">${icon('attention')}<span>Provider administration is unconfirmed. Local registrations remain inspectable.</span><a href="${href('account')}">Review access</a></div><div class="panel table-panel"><table class="flat-table"><caption>Observed runtime records · sample data</caption><thead><tr><th>Resource</th><th>Local registration</th><th>Provider state</th><th>Observed</th><th>Details</th></tr></thead><tbody>${[['Runner pool A','Registered','Unknown','2 min ago'],['Runner pool B','Registered','Read unavailable','10 min ago'],['Execution adapter','Declared','Not a capacity source','5 min ago']].map(([n,l,p,t])=>`<tr><td><strong>${n}</strong></td><td data-label="Registration">${badge(l,'good')}</td><td data-label="Provider">${p}</td><td data-label="Observed">${t}</td><td data-label="Details"><button class="source-button" data-source="runtime">Inspect source</button></td></tr>`).join('')}</tbody></table></div><p class="notice">Registration does not prove available capacity. Runtime operations require their own current authority and confirmed source result.</p>`}
function account(){return `<section class="panel"><div class="account-summary"><span class="avatar">DO</span><div><h2>Demo operator</h2><span class="muted">GitHub · illustrative connected account</span></div>${badge('Connected','good','check')}</div><hr style="border:0;border-top:1px solid var(--lh-border);margin:16px 0"><div class="kv"><span class="muted">Read access</span><span>3 configured sample projects</span><span class="muted">Workflow dispatch</span><span>${badge('Not confirmed','warn')}</span><span class="muted">Last checked</span><span>Today, 19:00 UTC</span></div><p><button data-source="account">Review connection details</button></p></section><details class="panel"><summary>Permissions and recovery</summary><p>Show the exact missing source capability and its recovery route. Avoid repeating the same permission explanation beside every action.</p><p>The prototype does not connect an account or request permissions.</p></details><details class="panel"><summary>Disconnect and sign out</summary><p>A real disconnection must clearly identify the affected account and clear its protected saved views and drafts. It is separate from signing out of the application.</p></details>`}
function render(){shell();let html='';if(state==='revoked')html=`<section class="panel auth-loss">${icon('account')}<h2>Connection needs attention</h2><p>The saved view is no longer shown. Verify the current account before reading protected project data.</p><button data-source="account">Review connection</button><p class="notice">Authority-loss presentation only · the prototype has no real authentication.</p></section>`;else if(state==='loading'||state==='expired')html=`${statusline()}<div aria-busy="true" aria-label="Loading source records"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><p class="notice">${state==='expired'?'The saved view expired. Reading the current source.':'Reading this view for the first time.'} No empty-collection claim is made.</p>`;else if(state==='empty')html=`${statusline()}<section class="panel"><h2>No issues in the checked scope</h2><p>The sample collection completed successfully with no records.</p><a href="${href('projects')}">Browse repositories</a><p class="notice">This is different from loading, no search matches or an unavailable source.</p></section>`;else{if(state==='failed')html+='<div class="alert">'+icon('attention')+'<span>Refresh failed. Showing the last saved view · checked 15 min ago.</span><button id="retry">Retry refresh</button></div>';html+=({work,issues:work,projects:repositories,issue,attention,health,'health-detail':healthDetail,runtime,account}[view]||work)();}$('content').innerHTML=html;$('scenario').value=state;bind();}
function mobileLanes(){document.querySelectorAll('.lane').forEach(l=>l.hidden=innerWidth<=700&&group!=='all'&&l.dataset.group!==group)}
function bind(){document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>openSource(b.dataset.source,b.dataset.record));if($('search')){$('search').value=query;$('search').oninput=e=>{query=e.target.value;persist();$('work-results').innerHTML=renderWork();bindGroup();mobileLanes()};$('project-filter').onchange=e=>{project=e.target.value;persist();render()};bindGroup();mobileLanes()}if($('draft')){const key='lcc-demo-draft|demo-actor|'+current.project+'|'+current.id;$('draft').value=sessionStorage.getItem(key)||'';$('draft').oninput=()=>{sessionStorage.setItem(key,$('draft').value);$('draft-status').textContent='Draft saved in this demo tab.'};$('review-comment').onclick=()=>{if(!$('draft').value.trim()){$('draft-status').textContent='Write a response before reviewing.';$('draft').focus();return}$('preview-text').textContent=$('draft').value;$('preview-panel').hidden=false;$('back-to-edit').focus()};$('back-to-edit').onclick=()=>{$('preview-panel').hidden=true;$('draft').focus()}}if($('retry'))$('retry').onclick=refresh;}
function bindGroup(){if($('group-filter'))$('group-filter').onchange=e=>{group=e.target.value;persist();mobileLanes()}}
let timer;function refresh(){clearTimeout(timer);state='refreshing';render();timer=setTimeout(()=>{state='fresh';render()},1200)}
$('scenario').onchange=e=>{clearTimeout(timer);state=e.target.value;render()};$('refresh').onclick=refresh;$('source-close').onclick=()=>$('source-dialog').close();$('menu').onclick=()=>{const open=$('rail').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open));$('menu').setAttribute('aria-label',open?'Close navigation':'Open navigation');if(open)document.querySelector('nav a').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('rail').classList.contains('open')){$('rail').classList.remove('open');$('menu').setAttribute('aria-expanded','false');$('menu').setAttribute('aria-label','Open navigation');$('menu').focus()}});document.addEventListener('click',e=>{if(innerWidth<=700&&$('rail').classList.contains('open')&&!$('rail').contains(e.target)&&!$('menu').contains(e.target)){$('rail').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}});for(const m of ['light','dark','system'])$(m).onclick=()=>theme(m);function theme(m){document.documentElement.dataset.lhTheme=m;localStorage.setItem('lcc-demo-theme',m);for(const n of ['light','dark','system'])$(n).setAttribute('aria-pressed',String(n===m))}theme(params.get('theme')||localStorage.getItem('lcc-demo-theme')||'dark');addEventListener('resize',mobileLanes);render();
</script></body></html>
